<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Strip PII from PDFs and text, entirely in your browser." />
    <title>Redactyl</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash. Dark default.
      try {
        var t = localStorage.getItem('redactyl-theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
