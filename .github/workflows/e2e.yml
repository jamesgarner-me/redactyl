# E2E PII-recall gate — the one check that runs on a self-hosted RunPod GPU
# runner instead of GitHub's free runners. It needs a HARDWARE WebGPU adapter
# (the production q4f16 model runs only on the WebGPU EP), which GitHub-hosted
# runners don't have. See ADR 0003 (2026-06-03 correction) and the runner config
# in the worker-github_runner repo (docs/redactyl-runner.md).
#
# Flow:
#   1. boot-runner (GitHub-hosted) POSTs the RunPod serverless endpoint, which
#      boots a worker that registers an ephemeral `runpod`-labelled runner.
#   2. e2e (runs-on: self-hosted, runpod) is picked up by that runner, builds the
#      app, and drives the real UI with Playwright on the GPU. The runner is
#      ephemeral: it runs this one job, then de-registers and the worker exits.
#
# Regular CI (build/deploy) stays on GitHub's free runners — only this job uses
# RunPod.
name: E2E (PII recall · RunPod GPU)

on:
  workflow_dispatch:
  # Pre-release gate: run manually. Wire to `release`/tags here if you want it
  # to fire automatically before a deploy.

jobs:
  boot-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Boot ephemeral RunPod GPU runner
        # Async /run: returns immediately with a job id. The worker then comes up
        # and registers the self-hosted runner the e2e job below waits for. The
        # GitHub PAT + target repo live as env vars on the RunPod endpoint, so no
        # GitHub credentials pass through this workflow.
        run: |
          curl -fsS -X POST \
            "https://api.runpod.ai/v2/${{ secrets.RUNPOD_ENDPOINT_ID }}/run" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"input": {}}'

  e2e:
    needs: boot-runner
    runs-on: [self-hosted, runpod]
    # Cold model download + WASM/WebGPU warmup dominate; matches the Playwright
    # test timeout (20 min) with headroom for build + checkout.
    timeout-minutes: 30
    env:
      # Ask Chromium for a hardware Vulkan WebGPU adapter (see playwright.config.mjs).
      E2E_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Run E2E (Playwright on hardware WebGPU)
        # Playwright starts `vite preview` itself (webServer in the config) and
        # runs the three-legged oracle; its exit code is the gate.
        run: pnpm exec playwright test -c test/e2e/playwright.config.mjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts/
          if-no-files-found: ignore
